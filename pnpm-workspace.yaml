packages:
  - "apps/*"
  - "packages/*"
  - "mock-api"

# Single source of truth for every shared dependency version.
# This is what kills the react-icons 4-vs-5 / react-query 4.29-vs-4.35 skew:
# apps declare `"react": "catalog:"` and cannot drift apart.
catalog:
  # runtime + build
  react: 18.3.1
  react-dom: 18.3.1
  react-router-dom: ^6.28.0
  astro: ^4.16.18
  # astro:assets uses sharp to emit WebP for the hero images
  sharp: ^0.33.5
  "@astrojs/check": ^0.9.4
  "@astrojs/react": ^3.6.3
  # pinned: 3.7+ targets Astro 5 and breaks the astro:build:done hook on Astro 4
  "@astrojs/sitemap": 3.2.1
  vite: ^5.4.11
  "@vitejs/plugin-react-swc": ^3.7.2
  vite-tsconfig-paths: ^5.1.4
  typescript: 5.6.3

  # types
  "@types/node": ^20.17.9
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1
  "@types/js-cookie": ^3.0.6
  "@types/file-saver": ^2.0.7
  "@types/papaparse": ^5.3.15

  # data + state
  "@tanstack/react-query": ^4.36.1
  "@tanstack/react-query-devtools": ^4.36.1
  "@tanstack/react-table": ^8.20.5
  jotai: ^2.10.3
  cmdk: ^1.0.4
  axios: ^1.7.9
  js-cookie: ^3.0.5

  # forms
  react-hook-form: ^7.54.0
  "@hookform/resolvers": ^3.9.1
  yup: ^1.5.0
  react-select: ^5.8.3
  react-datepicker: ^7.5.0
  react-day-picker: ^9.4.2
  react18-input-otp: ^1.1.4
  react-phone-input-2: ^2.15.1
  react-use-measure: ^2.1.7

  # ui
  "@heroicons/react": ^2.2.0
  classnames: ^2.5.1
  clsx: ^2.1.1
  react-toastify: ^9.1.3
  sonner: ^2.0.7
  framer-motion: ^10.18.0

  # charts
  chart.js: ^4.4.7
  react-chartjs-2: ^5.2.0
  recharts: ^2.14.1

  # docs / export
  "@react-pdf/renderer": ^3.4.5
  file-saver: ^2.0.5
  papaparse: ^5.4.1
  xlsx: ^0.18.5

  # misc
  date-fns: ^4.1.0
  use-debounce: ^10.0.4
  uuid: ^13.0.0
  "@aws-sdk/client-s3": ^3.709.0
  # kept at v4 deliberately: bumping a payment integration's major during a
  # framework port makes failures ambiguous. Upgrade separately, after.
  react-paystack: ^4.0.3

  # styling
  lucide-react: ^1.27.0
  class-variance-authority: ^0.7.1
  tailwind-merge: ^2.5.5
  tailwindcss: ^4.1.13
  "@tailwindcss/vite": ^4.1.13
  "@tailwindcss/postcss": ^4.1.13
  tw-animate-css: ^1.3.8
  autoprefixer: ^10.4.20
  postcss: ^8.4.49
  sass: ^1.83.0
  # required by Vite's `scss.api: "modern-compiler"` (avoids the deprecated
  # legacy dart-sass JS API and its build-time warning)
  sass-embedded: ^1.83.0

  # test — the console's auth flow is the first executed frontend code
  vitest: ^2.1.8
  jsdom: ^25.0.1
  "@testing-library/react": ^16.1.0
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/user-event": ^14.5.2

  # lint / format
  eslint: ^8.57.1
  "@typescript-eslint/eslint-plugin": ^7.18.0
  "@typescript-eslint/parser": ^7.18.0
  eslint-plugin-react: ^7.37.2
  eslint-plugin-react-hooks: ^4.6.2
  eslint-plugin-react-refresh: ^0.4.16
  eslint-plugin-check-file: ^2.8.0
  eslint-plugin-import: ^2.31.0
  eslint-plugin-boundaries: ^4.2.2
  eslint-import-resolver-typescript: ^3.6.3
  prettier: ^3.4.2
